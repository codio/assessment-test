<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced test assessment</title>
  <script type="module">
    import {unified} from '//esm.sh/unified@11?bundle'
    import remarkParse from '//esm.sh/remark-parse@11?bundle'
    import dompurify from 'https://cdn.jsdelivr.net/npm/dompurify@3.4.1/+esm'
    import rehypeSanitize from 'https://esm.sh/rehype-sanitize@6?bundle'
    import rehypeStringify from 'https://esm.sh/rehype-stringify@10?bundle'
    import remarkRehype from 'https://esm.sh/remark-rehype@11?bundle'
    import rehypeExternalLinks from 'https://esm.sh/rehype-external-links@3?bundle'

    window.unified = unified
    window.remarkParse = remarkParse
    window.DOMPurify = dompurify
    window.rehypeSanitize = rehypeSanitize
    window.rehypeStringify = rehypeStringify
    window.remarkRehype = remarkRehype
    window.rehypeExternalLinks = rehypeExternalLinks
  </script>
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']],
        processEscapes: true,
        autoload: {
          color: [],
          colorv2: ['color']
        },
        packages: {'[+]': ['noerrors']}
      },
      options: {
        skipHtmlTags: ["script","noscript","style","textarea","pre","code","button"],
        enableMenu: false,
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      }
    };
  </script>
  <script defer src="//cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
  <script src="//cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <link type="text/css" rel="stylesheet" href="./index.css">
  <link type="text/css" rel="stylesheet" href="../assessment-common/assessment.css">
  <script type="text/javascript" src="../assessment-common/helper.js"></script>
  <script type="text/javascript" src="./index.js"></script>
</head>
<body>
  <div class="codio-assessment codio-assessment-test hide">
    <h3 class="codio-assessment-name"></h3>
    <div class="codio-assessment-content">
      <div class='codio-assessment-instructions'>
        <div class='instructions-text'></div>
      </div>
    </div>
    <div class="codio-assessment-guidance-block"></div>
    <div class="codio-assessment-footer">
      <button class='unblock-button codio-assessment-button'>Modify answer</button>
      <button class='check-button codio-assessment-button'></button>
      <button class='reset-button codio-assessment-button'>Reset</button>
    </div>
    <div class="codio-assessment-results-block"></div>
  </div>
</body>
</html>
